<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss: https:; img-src 'self' data: blob:;"
    />
    <meta
      name="description"
      content="MChess 3D: Jogo de xadrez 3D animado no navegador com peças vivas, cenário procedural, IA adaptativa, P2P e salvamento em texto puro."
    />
    <title>MChess 3D — Xadrez Vivo</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "MChess 3D",
        "inLanguage": "pt-BR",
        "genre": "Board Game / Chess",
        "applicationCategory": "Game",
        "operatingSystem": "Web Browser"
      }
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <strong>MChess 3D</strong>
        <span id="status-badge" class="badge">Turno: Brancas</span>
        <span id="biome-badge" class="badge secondary">Bioma: ...</span>
      </div>
      <nav class="toolbar" aria-label="Controles principais">
        <button id="btn-new-game" type="button">Novo Jogo</button>
        <button id="btn-p2p" type="button">Convidar 1v1</button>
        <button id="btn-hwid" type="button">HWID / .TXT</button>
        <button id="btn-scoreboard" type="button">Mural</button>
        <button id="btn-audio" type="button">Áudio</button>
        <button id="btn-a11y" type="button">Acessibilidade / LGPD</button>
        <button id="btn-admin" type="button">ADMIN</button>
      </nav>
    </header>

    <main class="workspace">
      <section id="canvas-container" aria-label="Tabuleiro de xadrez 3D"></section>

      <aside class="sidebar">
        <div class="card">
          <h2>Partida Atual (<span id="hwid-mini">...</span>)</h2>
          <p id="match-info">Modo: 1 vs IA</p>
          <p id="ai-info">IA Elo: 700 (Nível 1)</p>
          <div class="btn-row">
            <button id="btn-cam-w" type="button">Brancas</button>
            <button id="btn-cam-b" type="button">Pretas</button>
            <button id="btn-cam-top" type="button">Topo</button>
          </div>
          <label class="checkbox-row">
            <input id="chk-low-quality" type="checkbox" />
            <span>Modo Leve (PC/Celular)</span>
          </label>
          <label class="checkbox-row">
            <input id="chk-special-mode" type="checkbox" checked />
            <span>Modo Especial (Finalizações)</span>
          </label>
          <label class="checkbox-row">
            <input id="chk-animated-mode" type="checkbox" />
            <span>Modo Animado (Skinview3D)</span>
          </label>
        </div>

        <div class="card">
          <h2>Seu HWID (Anote!)</h2>
          <code id="hwid-short" class="hwid-code">Calculando...</code>
          <div class="btn-row">
            <button id="btn-copy-hwid" type="button">Copiar Hash</button>
            <button id="btn-export-txt" type="button">Baixar .TXT</button>
          </div>
        </div>

        <div class="card history-card">
          <h2>Lances (SAN)</h2>
          <ol id="move-history" class="history-list"></ol>
        </div>
      </aside>
    </main>

    <div id="tts-subtitle" class="subtitle" aria-live="polite"></div>

    <!-- Modal Reutilizável -->
    <dialog id="app-modal" class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Configuração</h3>
        <button id="modal-close" type="button" aria-label="Fechar">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </dialog>

    <footer class="app-footer">
      <span>
        © <span id="copyright-period">2026</span>
        <a href="https://github.com/magnocat" target="_blank" rel="noopener noreferrer">MagnoCat</a>
        — Feito para meu filho Miguel Magno • Licença MIT (Open Source) •
        <span id="app-version">Versão local</span>
      </span>
    </footer>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
