name: Filtro de Qualidade em Pull Requests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar tamanho do diff e checklist do PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const totalChanges = (pr.additions || 0) + (pr.deletions || 0);
            const hasChecklist = body.includes('- [x]');
            const warnings = [];

            if (!hasChecklist) {
              warnings.push('- O checklist obrigatório do template de Pull Request não foi preenchido (`- [x]`).');
            }
            if (totalChanges > 1500) {
              warnings.push(`- Alteração muito grande (${totalChanges} linhas). PRs extensos sem discussão prévia serão fechados.`);
            }

            if (warnings.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['needs-review'],
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: [
                  'Olá! Este repositório aplica filtro automático contra PRs genéricos ou sem validação.',
                  '',
                  ...warnings,
                  '',
                  'Por favor, preencha o checklist após rodar `npm run lint`, `npm run security`, `npm test` e `npm run build`.',
                ].join('\n'),
              });
            }
